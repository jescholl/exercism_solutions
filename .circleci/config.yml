version: 2.0

jobs:
  go:
    docker:
      - image: cimg/go:1.10.8@sha256:9fb02b542d8f9002fbe5abe13edf0f61accddc8def48410f01f594cbd89f5c52
    steps:
      - checkout
      - run:
          name: Run Tests
          command: ./go/run_tests
  python:
    docker:
      - image: cimg/python:3.11.5@sha256:5eb03f6b4a6dbc1f1abe9c51e6b7cff571ea0ff69ff793e83b7b633efaaa66e9
    steps:
      - checkout
      - run:
          name: Install pytest
          command: pip install pytest
      - run:
          name: Run Tests
          command: ./python/run_tests

workflows:
  version: 2
  build:
    jobs:
      - python
      - go
